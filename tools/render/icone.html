<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Icône Cordo 63</title>
<style>
  html, body { margin: 0; background: transparent; }
  /* l'icône d'appli : CORDO63 à l'encre noire sur le crème, lacé par un lacet rouge qui passe dessus, dessous
     (CO.Lacets.logoSVG, forme « carre » : CORDO puis 63 sur deux lignes, le lacet en Z comme les deux rangs
     d'œillets d'une chaussure). ?k=0.8 : la version masquable, tout tient dans la zone sûre (80 %). */
  #ic { width: 512px; height: 512px; background: #FFF2E2; overflow: hidden; }
  #ic svg { display: block; width: 512px; height: 512px; }
</style>
</head>
<body>
<div id="ic"></div>
<script src="../../js/co-core.js"></script>
<script src="../../js/co-brand.js"></script>
<script src="../../js/co-lacets.js"></script>
<script>
  const k = +new URLSearchParams(location.search).get('k') || 1;
  document.getElementById('ic').innerHTML = CO.Lacets.logoSVG({ forme: 'carre', fond: '#FFF2E2', k, id: 'ic' });
</script>
</body>
</html>
